name: Compiler l'appli iPhone

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature)
        run: |
          xcodebuild archive \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/HelloWorld.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Créer le fichier .ipa
        run: |
          mkdir -p Payload
          cp -R build/HelloWorld.xcarchive/Products/Applications/HelloWorld.app Payload/
          zip -qr HelloWorld.ipa Payload

      - name: Mettre l'ipa à disposition
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-ipa
          path: HelloWorld.ipa
